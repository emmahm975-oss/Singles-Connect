{% extends 'core/base.html' %}
{% block content %}
<section class="section" style="max-width: 400px; padding: 60px 20px; margin: 0 auto;">
    <h2 style="text-align: center; margin-bottom: 30px;">Set New <span style="color: #e50914;">Password</span></h2>
    <form method="POST" style="background: #f9f9f9; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05);">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-red" style="width: 100%; border: none; cursor: pointer; font-size: 1.1rem; margin-top: 15px;">Change Password</button>
    </form>
</section>
{% endblock %}
