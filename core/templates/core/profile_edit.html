{% extends 'core/base.html' %}

{% block content %}
<section class="section" style="max-width: 500px; padding: 60px 20px; margin: 0 auto;">
    <h2 style="text-align: center; margin-bottom: 30px;">Edit <span style="color: #e50914;">Profile</span></h2>
    
    <!-- IMPORTANT: We must add enctype for file uploads to work -->
    <form method="POST" enctype="multipart/form-data" style="background: #f9f9f9; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05);">
        {% csrf_token %}
        
        <p style="margin-bottom: 15px;">
            <label style="font-weight: bold;">Profile Photo:</label><br>
            <!-- Show current photo if it exists -->
            {% if user.profile.profile_photo %}
                <img src="{{ user.profile.profile_photo.url }}" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 10px;">
            {% endif %}
            <input type="file" name="profile_photo" accept="image/*" style="width:100%; padding:10px; background: #fff; border:1px solid #ddd; border-radius:8px;">
        </p>
        
        <p style="margin-bottom: 15px;">
            <label style="font-weight: bold;">Occupation:</label><br>
            <input type="text" name="occupation" value="{{ user.profile.occupation }}" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:8px;">
        </p>

        <p style="margin-bottom: 25px;">
            <label style="font-weight: bold;">Short Bio:</label><br>
            <textarea name="bio" rows="4" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:8px;">{{ user.profile.bio }}</textarea>
        </p>
        
        <button type="submit" class="btn btn-red" style="width: 100%; border: none; cursor: pointer; font-size: 1.1rem;">Save Changes</button>
    </form>
</section>
{% endblock %}
