{% extends 'core/base.html' %}

{% block content %}
<section class="section" style="max-width: 400px; padding: 60px 20px; margin: 0 auto;">
    <h2 style="text-align: center; margin-bottom: 30px;">Reset <span style="color: #e50914;">Password</span></h2>
        {% if error %}
        <div style="background: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; border: 1px solid #f5c6cb;">
            <strong>Error:</strong> {{ error }}
        </div>
    {% endif %}
    
    <form method="POST" style="background: #f9f9f9; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05);">
        {% csrf_token %}
        <p style="margin-bottom: 20px; color: #666;">Enter your email address and we will send you a link to reset your password.</p>
        <p style="margin-bottom: 25px;">
            <input type="email" name="email" placeholder="Email Address" required style="width:100%; padding:12px; border:1px solid #ddd; border-radius:8px;">
        </p>
        
        <button type="submit" class="btn btn-red" style="width: 100%; border: none; cursor: pointer; font-size: 1.1rem;">Send Reset Link</button>
    </form>
</section>
{% endblock %}
